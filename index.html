<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JeniLab 3D - Bambu Lab Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f19',
                        darkcard: '#111827',
                        accent: '#06b6d4',
                        accenthover: '#0891b2'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-darkbg text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <div id="app-header"></div>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <div id="page-outlet"></div>
    </main>

    <div id="modal-outlet"></div>

    <footer class="border-t border-gray-800 py-4 text-center text-xs text-gray-500 bg-darkcard/30">
        <p>© 2026 JeniLab 3D • Otimizado para Bambu Lab A1</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
