<div class="space-y-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-darkcard border border-gray-800 rounded-2xl p-6">
        <div>
            <h2 class="text-xl font-bold flex items-center space-x-2">
                <i class="fa-solid fa-box-archive text-accent"></i>
                <span>HISTÓRICO DE VENDAS</span>
            </h2>
            <p class="text-xs text-gray-400 mt-1">Pedidos enviados e salvos. Pesquise pela data em que o pedido foi criado.</p>
        </div>
        <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
            <input id="hist-busca-data" type="text" placeholder="Pesquisar por data (ex: 23/09/2026)" class="bg-darkbg border border-gray-700 text-white text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-accent w-full sm:w-64" />
        </div>
    </div>

    <div id="lista-historico" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Preenchido via JS -->
    </div>
</div>

<div id="hist-modal-excluir" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-darkcard border border-red-500/30 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
        <h3 class="text-lg font-bold text-white flex items-center space-x-2">
            <i class="fa-solid fa-triangle-exclamation text-red-400"></i>
            <span>Excluir pedido do histórico</span>
        </h3>
        <p id="hist-modal-texto" class="text-xs text-gray-400 leading-relaxed">
            Essa ação é permanente e pode afetar as métricas usadas para popular os gráficos de vendas.
            Para confirmar, digite <strong class="text-red-400">DELETAR</strong> no campo abaixo.
        </p>
        <input
            id="hist-confirma-input"
            type="text"
            placeholder="Digite DELETAR"
            autocomplete="off"
            class="w-full bg-darkbg border border-gray-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-red-400"
        />
        <div class="flex justify-end space-x-3 pt-3 border-t border-gray-800">
            <button id="hist-modal-cancelar" class="px-4 py-2 bg-gray-800 text-gray-300 rounded-xl text-xs font-semibold hover:bg-gray-700">Cancelar</button>
            <button id="hist-modal-confirmar" disabled class="px-4 py-2 bg-red-500/30 text-red-300 font-bold rounded-xl text-xs cursor-not-allowed transition">Confirmar Exclusão</button>
        </div>
    </div>
</div>
