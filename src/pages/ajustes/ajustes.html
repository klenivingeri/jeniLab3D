<div class="space-y-6">
    <div class="bg-darkcard border border-gray-800 rounded-2xl p-6 shadow-xl space-y-6">
        <div>
            <h2 class="text-xl font-bold flex items-center space-x-2">
                <i class="fa-solid fa-gear text-accent"></i>
                <span>CONFIGURAÇÕES DA MÁQUINA E NEGÓCIO</span>
            </h2>
            <p class="text-xs text-gray-400 mt-1">Defina parâmetros operacionais da sua Bambu Lab A1.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Consumo (Watts)</label>
                <input type="number" id="cfg-watts" value="150" class="w-full bg-darkbg border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-accent">
            </div>
            <div>
                <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Custo Energia (R$ / KWH)</label>
                <input type="number" id="cfg-kwh" value="1.25" step="0.01" class="w-full bg-darkbg border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-accent">
            </div>
            <div>
                <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Preço da Máquina (R$)</label>
                <input type="number" id="cfg-maquina-preco" value="3500" class="w-full bg-darkbg border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-accent">
            </div>
            <div>
                <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Vida Útil (Horas)</label>
                <input type="number" id="cfg-vida-util" value="5000" class="w-full bg-darkbg border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-accent">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-gray-800 pt-4">
            <div>
                <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Custo Padrão Filamento / KG (R$)</label>
                <input type="number" id="cfg-custo-kg-padrao" value="100" class="w-full bg-darkbg border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-accent">
            </div>
            <div>
                <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Mão de Obra (R$ / H)</label>
                <input type="number" id="cfg-mao-de-obra" value="15" class="w-full bg-darkbg border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-accent">
            </div>
        </div>

        <div class="pt-4 flex justify-end">
            <button id="cfg-salvar" class="px-6 py-3 bg-accent hover:bg-accenthover text-darkbg font-bold rounded-xl transition shadow-lg shadow-accent/20">
                Salvar Configurações
            </button>
        </div>
    </div>
</div>
